# Local development only: pairs the selector with cmd/mihomo-mock.
http:
  listen: 127.0.0.1:8788
mihomo:
  controller: http://127.0.0.1:9090
  secret_env: MIHOMO_SECRET
  request_timeout_seconds: 3
storage:
  path: data/dev-selector.db
scanner:
  concurrency: 4
  max_candidates: 60
  samples: 3
  timeout_ms: 1000
  min_success_rate: 0.95
  median_target_ms: 300
  p95_target_ms: 800
  jitter_target_ms: 200
  probes:
    - name: chatgpt-trace
      url: https://chatgpt.com/cdn-cgi/trace
      expected_status: "200"
    - name: openai-api-reachability
      url: https://api.openai.com/v1/models
      expected_status: "401"
regions:
  - code: JP
    name: Japan
    emoji: "🇯🇵"
    aliases: ["🇯🇵", "日本", "JP", "Japan", "Tokyo", "东京", "東京", "Osaka", "大阪"]
  - code: US
    name: United States
    emoji: "🇺🇸"
    aliases: ["🇺🇸", "美国", "US", "USA", "United States", "Los Angeles"]
  - code: KR
    name: Korea
    emoji: "🇰🇷"
    aliases: ["🇰🇷", "韩国", "KR", "Korea", "Seoul", "首尔"]
region_overrides: {}
egress_verification:
  enabled: false
auto_switch:
  enabled: false
