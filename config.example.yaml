# Copy to config.yaml and keep the copy out of source control.
http:
  # A loopback-only listener is the safe default. Do not use 0.0.0.0 without an
  # explicit API token and an allow-list of trusted LAN/Tailscale CIDRs.
  listen: 127.0.0.1:8788
  api_token: ""
  # api_token_env: MSS_API_TOKEN
  # allow_unauthenticated_lan: false
  allowed_cidrs: []

mihomo:
  # Keep the Mihomo controller local to the router/service host.
  # GUI overrides permit loopback/private targets; other targets must use this exact URL.
  # Server credentials are bound to this URL (including scheme, port and base path).
  controller: http://127.0.0.1:9090
  # The secret is read from this environment variable, never from this file.
  secret_env: MIHOMO_SECRET
  # Optional one-line secret file, resolved relative to this config file.
  # When set it takes precedence over secret_env. Keep it outside Git, mode 0600.
  # secret_file: private/mihomo-secret
  request_timeout_seconds: 8

storage:
  retention:
    scan_days: 30
    max_scans: 200
    audit_days: 180
    max_audit: 1000
  path: data/selector.db

scanner:
  # Concurrency is shared across scans; duplicate groups are rejected.
  max_active_scans: 2
  # Stable mode: screen all nodes, then refine top K plus the eligible current node.
  refine_top_k: 10
  # Measured results expire before selection; retest and confirm again.
  result_max_age_seconds: 600
  # Custom profiles are added to the built-ins. Bind any Selector to a service
  # in the UI; group names do not need to match a built-in service name.
  # See docs/service-adaptation.md for a complete custom profile example.
  concurrency: 4
  # A broad request is split into sequential batches; each keeps probe load
  # bounded while the UI reports completed/total candidates and batch number.
  batch_size: 60
  max_total_candidates: 500
  samples: 3
  timeout_ms: 5000
  min_success_rate: 0.95
  median_target_ms: 300
  p95_target_ms: 800
  jitter_target_ms: 200
  probes:
    - name: chatgpt-trace
      url: https://chatgpt.com/cdn-cgi/trace
      expected_status: "200"
    - name: openai-api-reachability
      url: https://api.openai.com/v1/models
      # Deliberately unauthenticated: an HTTP 401 demonstrates TCP/TLS/HTTP
      # reachability without storing an OpenAI API key.
      expected_status: "401"

# The name-classifier is only a candidate filter. It never claims actual egress
# country. Actual egress verification is separate and optional below.
# Built-in region aliases remain available; entries below extend that dictionary.
# See docs/region-classification.md for merge rules and ambiguous transit names.
regions:
  - code: JP
    name: Japan
    emoji: "🇯🇵"
    aliases: ["🇯🇵", "日本", "JP", "JPN", "Japan", "Tokyo", "东京", "東京", "Osaka", "大阪"]
  - code: US
    name: United States
    emoji: "🇺🇸"
    aliases: ["🇺🇸", "美国", "美國", "US", "USA", "United States", "Los Angeles", "Seattle", "New York"]
  - code: KR
    name: Korea
    emoji: "🇰🇷"
    aliases: ["🇰🇷", "韩国", "韓國", "KR", "KOR", "Korea", "South Korea", "Korean", "Seoul", "Busan", "首尔", "首爾", "釜山"]

# Manual rules take precedence over aliases. Example:
# region_overrides:
#   "IPLC-HY2-A-03": JP
region_overrides: {}

# Enabling this makes the scanner mutate only this dedicated, hidden selector.
# It must never be the user's service selector. The scanner serializes calls
# because a selector has one active member at a time.
# Optional isolated probe core. Omit to use the primary Mihomo Controller.
# It must listen on a loopback IP; credentials stay in backend configuration.
# egress_controller:
#   controller: http://127.0.0.1:9091
#   secret_file: probe-controller-secret
#   request_timeout_seconds: 8
egress_verification:
  enabled: false
  selector_group: __SMART_PROBE__
  proxy_url: http://127.0.0.1:17890
  trace_url: https://chatgpt.com/cdn-cgi/trace

# Optional IP intelligence sources for ChatGPT monitoring. Configure any subset.
# Within each source, a nonempty environment value takes precedence over its file.
ip_intelligence:
  # Legacy IPQualityScore fallback; existing configurations remain supported.
  api_key_env: IPQUALITYSCORE_API_KEY
  api_key_file: ""
  ipqualityscore:
    enabled: true
    # Omitted key fields use the legacy fields above.
  scamalytics:
    enabled: true
    api_key_env: SCAMALYTICS_API_KEY
    api_key_file: ""
    username_env: SCAMALYTICS_USERNAME
    username: "" # An explicit username takes precedence over username_env.
    server: eu # eu=api12, us=api11; must match the node selected at sign-up.
  ipapi_is:
    enabled: true
    api_key_env: IPAPI_IS_API_KEY
    api_key_file: ""
  abuseipdb:
    enabled: true
    api_key_env: ABUSEIPDB_API_KEY
    api_key_file: ""
# Relative secret file paths resolve next to this configuration file.

auto_switch:
  # Reserved for the scheduler phase; manual selection remains the default.
  enabled: false
  min_score: 75
  improvement_threshold_percent: 15
  better_rounds: 3
  cooldown_minutes: 20
  failure_threshold: 2
