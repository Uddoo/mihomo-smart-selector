name: 问题反馈 / Bug report
description: 提交可复现的问题及脱敏证据 / Report a reproducible defect with redacted evidence
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读[排障与反馈指南](https://github.com/Uddoo/mihomo-smart-selector/blob/main/docs/troubleshooting.md)，搜索已有 Issue，并确认当前版本。
        禁止上传完整代理配置、订阅链接、节点凭据或未脱敏日志；疑似漏洞请遵循 SECURITY.md。
        Do not submit Controller secrets, API tokens, provider URLs, node credentials, private service addresses, or complete proxy configurations. Follow SECURITY.md for suspected vulnerabilities.
  - type: input
    id: version
    attributes:
      label: 版本或提交 / Version or commit
      description: Release tag, commit SHA, or container/image digest if applicable.
      placeholder: e45a6b50737f5cfcda2a64f2e606c0c0da7fd0f4
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式 / Deployment method
      options:
        - Local source build
        - OpenWrt / iStoreOS procd template
        - Other reviewed deployment
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统与架构 / Platform and architecture
      placeholder: OpenWrt 24.x, linux/arm64
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Mihomo 与 OpenClash 版本 / Mihomo and OpenClash versions
      placeholder: Mihomo x.y.z; OpenClash x.y.z
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际行为 / What happened?
      description: Describe the observable defect and its impact without including secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Reproduction steps
      placeholder: |
        1. Start with...
        2. Submit...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 最小脱敏配置 / Minimal redacted configuration
      description: Remove secrets, tokens, provider URLs, node credentials, public IPs, and private service hostnames.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图 / Redacted logs or screenshots
      description: Include only the smallest relevant excerpt and state what was removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same defect.
          required: true
        - label: I removed secrets, credentials, provider URLs, and private identifiers.
          required: true
        - label: This is not a private vulnerability report.
          required: true
