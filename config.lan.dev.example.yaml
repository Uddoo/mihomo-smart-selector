# Local visual QA only. The token is intentionally non-sensitive and supplied
# at process startup as MSS_UI_TEST_TOKEN.
http:
  listen: 0.0.0.0:8789
  api_token_env: MSS_UI_TEST_TOKEN
  allowed_cidrs: [127.0.0.0/8]
mihomo:
  controller: http://127.0.0.1:9091
  secret_env: MIHOMO_SECRET
  request_timeout_seconds: 3
storage:
  path: data/lan-dev-selector.db
scanner:
  concurrency: 4
  # Small by design so local visual QA exercises multi-batch progress.
  batch_size: 2
  max_total_candidates: 500
  samples: 1
  timeout_ms: 3000
  min_success_rate: 0.95
  median_target_ms: 300
  p95_target_ms: 800
  jitter_target_ms: 200
  probes:
    - name: chatgpt-trace
      url: https://chatgpt.com/cdn-cgi/trace
      expected_status: "200"
regions:
  - code: JP
    name: Japan
    emoji: "🇯🇵"
    aliases: ["🇯🇵", "日本", "JP", "Japan", "Tokyo", "东京", "東京", "Osaka", "大阪"]
region_overrides: {}
egress_verification:
  enabled: false
auto_switch:
  enabled: false
