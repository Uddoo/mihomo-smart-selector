# OpenWrt/iStoreOS example. Review every address before installation and keep
# the installed copy mode 0600. The bundled OpenClash init script reads
# MIHOMO_SECRET from /etc/openclash/dukou.yaml and supplies MSS_API_TOKEN from
# /etc/mihomo-smart-selector/access-token.
http:
  # Replace this example CIDR with the narrow LAN or Tailnet range that should
  # be allowed to use the API. Non-loopback access requires both this allow-list
  # and the generated Bearer token by default.
  listen: 0.0.0.0:8788
  api_token_env: MSS_API_TOKEN
  allow_unauthenticated_lan: false
  allowed_cidrs: ["192.168.1.0/24"]
mihomo:
  controller: http://127.0.0.1:9090
  secret_env: MIHOMO_SECRET
  request_timeout_seconds: 8
storage:
  path: /opt/mihomo-smart-selector/data/selector.db
scanner:
  concurrency: 4
  batch_size: 60
  max_total_candidates: 500
  samples: 3
  timeout_ms: 5000
  min_success_rate: 0.95
  median_target_ms: 300
  p95_target_ms: 800
  jitter_target_ms: 200
  # Built-in profiles map OpenClash selector labels such as "🤖 ChatGPT",
  # "📹 YouTube" and "🚀 GitHub" to service-specific, no-credential probes.
  # `probes` remains only as a compatibility fallback for a custom deployment
  # that deliberately supplies no probe_profiles.
  probes:
    - name: chatgpt-trace
      url: https://chatgpt.com/cdn-cgi/trace
      expected_status: "200"
    - name: openai-api-reachability
      url: https://api.openai.com/v1/models
      expected_status: "401"
  # Configure a private service without replacing the other built-in profiles.
  # probe_profile_overrides:
  #   emby:
  #     requires_configuration: false
  #     probes:
  #       - name: emby-public-info
  #         url: https://media.example.com/emby/System/Info/Public
  #         expected_status: "200"
  # Strict checks (expected 401, response body, restricted statuses) remain
  # off until this router has an isolated selector and a local HTTP proxy that
  # routes only probe traffic. Never point selector_group at a business route.
  strict_verification:
    enabled: false
    # selector_group: "MSS Probe Only"
    # proxy_url: http://127.0.0.1:7890
    # max_candidates: 60
regions:
  - code: JP
    name: Japan
    emoji: "🇯🇵"
    aliases: ["🇯🇵", "日本", "JP", "JPN", "Japan", "Tokyo", "东京", "東京", "Osaka", "大阪"]
  - code: US
    name: United States
    emoji: "🇺🇸"
    aliases: ["🇺🇸", "美国", "美國", "US", "USA", "United States", "Los Angeles", "Seattle", "New York"]
  - code: KR
    name: Korea
    emoji: "🇰🇷"
    aliases: ["🇰🇷", "韩国", "韓國", "KR", "KOR", "Korea", "South Korea", "Korean", "Seoul", "Busan", "首尔", "首爾", "釜山"]
region_overrides: {}
egress_verification:
  enabled: false
auto_switch:
  enabled: false
  min_score: 75
  improvement_threshold_percent: 15
  better_rounds: 3
  cooldown_minutes: 20
  failure_threshold: 2
